name: portfolio-tests

on:
  push:
  pull_request:

jobs:
  mtf-macd-divergence-pro:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/MTF-MACD-Divergence-PRO-v1.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pytest -q

  mtf-stochastics-pro:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/MTF-Stochastics-PRO-v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pytest -q
